<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>思维导图索引</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 40px;
    }
    .list {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      border-color: #6366f1;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.12);
    }
    .icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: #eef2ff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 20px;
      height: 20px;
      stroke: #6366f1;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .info {
      flex: 1;
      min-width: 0;
    }
    .info .name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .info .desc {
      font-size: 13px;
      color: #6b7280;
    }
    .arrow {
      flex-shrink: 0;
      color: #9ca3af;
      font-size: 18px;
      transition: transform 0.15s;
    }
    .card:hover .arrow {
      transform: translateX(3px);
      color: #6366f1;
    }
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h1>思维导图索引</h1>
  <p class="subtitle">点击卡片打开对应的思维导图</p>
  <div class="list">
    <a class="card" href="android-frameworks-dev-mindmap.html">
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      </div>
      <div class="info">
        <div class="name">Android Frameworks 开发思维导图</div>
        <div class="desc">android-frameworks-dev-mindmap.html</div>
      </div>
      <div class="arrow">&#8594;</div>
    </a>
    <a class="card" href="android-kernel-mindmap.html">
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      </div>
      <div class="info">
        <div class="name">Android Kernel 思维导图</div>
        <div class="desc">android-kernel-mindmap.html</div>
      </div>
      <div class="arrow">&#8594;</div>
    </a>
    <a class="card" href="android-system-apps-dev-mindmap.html">
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      </div>
      <div class="info">
        <div class="name">Android 系统应用开发思维导图</div>
        <div class="desc">android-system-apps-dev-mindmap.html</div>
      </div>
      <div class="arrow">&#8594;</div>
    </a>
  </div>
  <footer>共 3 个文件 &middot; 更新于 2026-06-18</footer>
</body>
</html>
