<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android 16 SystemUI Knowledge Graph</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #181b22;
  --surface2: #1e222b;
  --border: #2a2e39;
  --text: #e1e4ea;
  --text2: #9ba1b0;
  --accent: #7cacf8;
  --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }
#app { display: grid; grid-template-columns: 320px 1fr 360px; grid-template-rows: 52px 1fr; height: 100vh; }
header { grid-column: 1/-1; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 14px; z-index: 100; }
header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
header h1 span { color: var(--accent); }
#search { flex: 1; max-width: 360px; padding: 7px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none; }
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text2); }
.stats { display: flex; gap: 14px; font-size: 12px; color: var(--text2); white-space: nowrap; }
.stats b { color: var(--accent); }
.view-toggle { display: flex; gap: 3px; }
.view-toggle button { padding: 5px 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text2); cursor: pointer; font-size: 12px; }
.view-toggle button.active { background: var(--accent); color: #000; border-color: var(--accent); }
#sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 0; }
#sidebar::-webkit-scrollbar { width: 5px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.cat-header { display: flex; align-items: center; gap: 7px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; user-select: none; transition: background 0.15s; }
.cat-header:hover { background: var(--surface2); }
.cat-header .arrow { font-size: 9px; width: 14px; text-align: center; transition: transform 0.2s; color: var(--text2); }
.cat-header .arrow.open { transform: rotate(90deg); }
.cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.cat-count { margin-left: auto; font-size: 10px; color: var(--text2); font-weight: 400; }
.children { display: none; padding-left: 14px; }
.children.open { display: block; }
.node-item { display: flex; align-items: center; gap: 5px; padding: 4px 14px 4px 18px; font-size: 12px; cursor: pointer; transition: background 0.15s; color: var(--text2); border-left: 2px solid transparent; }
.node-item:hover { background: var(--surface2); color: var(--text); }
.node-item.active { background: rgba(124,172,248,0.1); color: var(--accent); border-left-color: var(--accent); }
.node-item .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; opacity: 0.6; }
#graph-area { position: relative; overflow: hidden; background: var(--bg); }
#graph-container { width: 100%; height: 100%; }
svg { width: 100%; height: 100%; }
.link { stroke: #2a2e39; stroke-opacity: 0.6; }
.node circle { stroke-width: 2; cursor: pointer; }
.node text { font-size: 10px; fill: var(--text2); pointer-events: none; text-anchor: middle; }
.graph-controls { position: absolute; bottom: 14px; left: 14px; display: flex; gap: 5px; }
.graph-controls button { width: 32px; height: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.graph-controls button:hover { background: var(--surface2); }
#detail { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; }
#detail::-webkit-scrollbar { width: 5px; }
#detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text2); font-size: 13px; text-align: center; padding: 18px; }
.detail-header { padding: 18px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
.detail-header h2 { font-size: 17px; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
.detail-header .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }
.detail-header .desc { font-size: 12px; color: var(--text2); line-height: 1.6; margin-top: 7px; }
.detail-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.detail-section h3 { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 9px; }
.detail-section ul { list-style: none; }
.detail-section li { font-size: 12px; padding: 3px 0; display: flex; align-items: flex-start; gap: 5px; line-height: 1.5; }
.detail-class { padding: 10px 18px; border-bottom: 1px solid var(--border); }
.detail-class code { font-size: 11px; background: var(--surface2); padding: 2px 7px; border-radius: 4px; color: var(--accent); font-family: 'Cascadia Code', 'Fira Code', monospace; }
.detail-class .cls-label { font-size: 11px; color: var(--text2); margin-bottom: 5px; }
.relations { padding: 14px 18px; }
.relations h3 { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 9px; }
.rel-item { display: inline-block; padding: 3px 9px; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; font-size: 11px; margin: 2px 3px 2px 0; cursor: pointer; transition: all 0.15s; }
.rel-item:hover { border-color: var(--accent); color: var(--accent); }
.tooltip { position: fixed; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; font-size: 12px; pointer-events: none; z-index: 1000; max-width: 280px; box-shadow: 0 4px 18px rgba(0,0,0,0.4); }
.tooltip strong { color: var(--accent); }
#list-view { display: none; overflow-y: auto; padding: 18px; }
#list-view.active { display: block; }
#graph-area.hidden { display: none; }
.list-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s; }
.list-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.list-card h3 { font-size: 14px; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
.list-card p { font-size: 12px; color: var(--text2); line-height: 1.5; }
.cat-group-title { font-size: 18px; font-weight: 700; margin: 20px 0 10px; padding-bottom: 7px; border-bottom: 2px solid var(--border); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Android 16 <span>SystemUI</span> Knowledge Graph</h1>
    <input type="text" id="search" placeholder="Search features, class names, keywords...">
    <div class="stats">
      <span>Modules: <b id="s-cats">0</b></span>
      <span>Features: <b id="s-nodes">0</b></span>
      <span>Relations: <b id="s-links">0</b></span>
    </div>
    <div class="view-toggle">
      <button class="active" onclick="switchView('graph')">Graph</button>
      <button onclick="switchView('list')">List</button>
    </div>
  </header>
  <div id="sidebar"></div>
  <div id="graph-area"><div id="graph-container"><svg id="graph-svg"></svg></div>
    <div class="graph-controls">
      <button onclick="zIn()" title="Zoom In">+</button>
      <button onclick="zOut()" title="Zoom Out">-</button>
      <button onclick="zReset()" title="Reset">⟲</button>
    </div>
  </div>
  <div id="list-view"></div>
  <div id="detail"><div class="detail-empty"><div><div style="font-size:36px;margin-bottom:10px;">📋</div>Click any node<br>to view details</div></div></div>
</div>

// ======================== FLATTEN ========================
const NODES = [];
C.forEach(cat => { cat.children.forEach(n => { NODES.push({...n, cat: cat.id}); }); });

// ======================== RENDER ========================
let svgG, zb;

function init() {
  let lc = 0;
  C.forEach(c => { lc += c.children.length; c.children.forEach(n => { if(n.r) lc += n.r.length; }); });
  document.getElementById('s-cats').textContent = C.length;
  document.getElementById('s-nodes').textContent = NODES.length;
  document.getElementById('s-links').textContent = lc;
  renderSidebar(); renderGraph(); setupSearch();
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = C.map(cat => `<div class="category" data-cat="${cat.id}">
    <div class="cat-header" onclick="toggleCat(this)"><span class="arrow">▶</span>
    <span class="cat-dot" style="background:${cat.c}"></span><span>${cat.name}</span>
    <span class="cat-count">${cat.children.length}</span></div>
    <div class="children">${cat.children.map(n => `<div class="node-item" data-id="${n.id}" onclick="selectNode('${n.id}')">
      <span class="dot" style="background:${cat.c}"></span><span>${n.name}</span></div>`).join('')}</div></div>`).join('');
}

function toggleCat(el) {
  el.nextElementSibling.classList.toggle('open');
  el.querySelector('.arrow').classList.toggle('open');
}

function renderGraph() {
  const container = document.getElementById('graph-container');
  const rect = container.getBoundingClientRect();
  const w = rect.width || 800, h = rect.height || 600;
  const svg = document.getElementById('graph-svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = '';

  const nodes = [], links = [];
  const catMap = {}; C.forEach(c => catMap[c.id] = c);
  // category nodes
  C.forEach((c,i) => {
    const angle = (2*Math.PI/C.length)*i - Math.PI/2;
    const r = Math.min(w,h)*0.32;
    nodes.push({id:c.id, name:c.name.split(' ')[0], color:c.c, r:20, isCat:true, cat:c.id,
      x:w/2+Math.cos(angle)*r, y:h/2+Math.sin(angle)*r, vx:0, vy:0});
  });
  // feature nodes
  const nodeById = {};
  nodes.forEach(n => nodeById[n.id] = n);
  NODES.forEach(n => {
    const cat = catMap[n.cat];
    const parent = nodeById[n.cat];
    nodes.push({id:n.id, name:n.name.length>7?n.name.substring(0,7)+'..':n.name, color:cat.c, r:8, isCat:false, cat:n.cat,
      x:parent.x+(Math.random()-0.5)*100, y:parent.y+(Math.random()-0.5)*100, vx:0, vy:0});
    links.push({source:n.cat, target:n.id, color:cat.c, cross:false});
  });
  nodes.forEach(n => nodeById[n.id] = n);
  // cross links
  NODES.forEach(n => {
    (n.r||[]).forEach(rid => {
      if(nodeById[rid]) {
        const tn = NODES.find(x => x.id === rid);
        links.push({source:n.id, target:rid, color: tn ? catMap[tn.cat].c : '#555', cross:true});
      }
    });
  });

  // force simulation
  for(let iter=0;iter<300;iter++) {
    const a = 0.3*(1-iter/300);
    // center gravity
    nodes.forEach(n => { n.vx+=(w/2-n.x)*0.0004*a; n.vy+=(h/2-n.y)*0.0004*a; });
    // cat repulsion
    const cats = nodes.filter(n=>n.isCat);
    for(let i=0;i<cats.length;i++) for(let j=i+1;j<cats.length;j++) {
      const dx=cats[j].x-cats[i].x, dy=cats[j].y-cats[i].y;
      const d=Math.sqrt(dx*dx+dy*dy)||1, f=4000/(d*d);
      cats[i].vx-=dx/d*f*a; cats[i].vy-=dy/d*f*a;
      cats[j].vx+=dx/d*f*a; cats[j].vy+=dy/d*f*a;
    }
    // link spring
    links.forEach(l => {
      const s=nodeById[l.source], t=nodeById[l.target];
      if(!s||!t) return;
      const dx=t.x-s.x, dy=t.y-s.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      const ideal=l.cross?70:(s.isCat||t.isCat?90:55), f=(d-ideal)*0.004*a;
      const fx=dx/d*f, fy=dy/d*f;
      if(!s.isCat){s.vx+=fx;s.vy+=fy;} if(!t.isCat){t.vx+=fx;t.vy+=fy;}
      if(s.isCat){s.vx-=fx*0.05;s.vy-=fy*0.05;} if(t.isCat){t.vx-=fx*0.05;t.vy-=fy*0.05;}
    });
    // node repulsion
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++) {
      const dx=nodes[j].x-nodes[i].x, dy=nodes[j].y-nodes[i].y;
      const d=Math.sqrt(dx*dx+dy*dy)||1, minD=(nodes[i].r+nodes[j].r)*2;
      if(d<minD){const f=(minD-d)*0.015*a; nodes[i].vx-=dx/d*f; nodes[i].vy-=dy/d*f; nodes[j].vx+=dx/d*f; nodes[j].vy+=dy/d*f;}
    }
    // apply
    nodes.forEach(n => { n.vx*=0.85; n.vy*=0.85; n.x+=n.vx; n.y+=n.vy;
      n.x=Math.max(n.r+5,Math.min(w-n.r-5,n.x)); n.y=Math.max(n.r+5,Math.min(h-n.r-5,n.y)); });
  }

  // draw SVG
  const g = document.createElementNS("http://www.w3.org/2000/svg","g"); svgG = g;
  links.forEach(l => {
    const s=nodeById[l.source], t=nodeById[l.target]; if(!s||!t) return;
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",s.x);line.setAttribute("y1",s.y);line.setAttribute("x2",t.x);line.setAttribute("y2",t.y);
    line.setAttribute("stroke",l.color);line.setAttribute("stroke-opacity",l.cross?0.06:0.2);
    line.setAttribute("stroke-width",l.cross?0.4:1.2);line.classList.add('link');g.appendChild(line);
  });
  nodes.forEach(n => {
    const grp=document.createElementNS("http://www.w3.org/2000/svg","g"); grp.classList.add('node'); grp.dataset.id=n.id;
    if(n.isCat){const gl=document.createElementNS("http://www.w3.org/2000/svg","circle");
      gl.setAttribute("cx",n.x);gl.setAttribute("cy",n.y);gl.setAttribute("r",n.r+6);
      gl.setAttribute("fill",n.color);gl.setAttribute("fill-opacity","0.1");grp.appendChild(gl);}
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",n.x);c.setAttribute("cy",n.y);c.setAttribute("r",n.r);
    c.setAttribute("fill",n.color);c.setAttribute("fill-opacity",n.isCat?"0.85":"0.55");
    c.setAttribute("stroke",n.color);grp.appendChild(c);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",n.x);t.setAttribute("y",n.y+n.r+12);t.textContent=n.name;
    t.style.fontSize=n.isCat?'11px':'9px';t.style.fontWeight=n.isCat?'600':'400';
    t.style.fill=n.isCat?n.color:'#9ba1b0';grp.appendChild(t);
    grp.addEventListener('click',()=>selectNode(n.id));
    grp.addEventListener('mouseenter',e=>showTip(e,n));
    grp.addEventListener('mouseleave',hideTip);
    g.appendChild(grp);
  });
  svg.appendChild(g);

  // zoom/pan
  let scale=1,tx=0,ty=0;
  function applyT(){g.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
  zb={applyT,get s(){return scale},set s(v){scale=v},get tx(){return tx},set tx(v){tx=v},get ty(){return ty},set ty(v){ty=v}};
  svg.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY>0?0.9:1.1,ns=Math.max(0.2,Math.min(5,scale*d));
    const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    tx=mx-(mx-tx)*(ns/scale);ty=my-(my-ty)*(ns/scale);scale=ns;applyT();});
  let dragging=false,dx0,dy0,tx0,ty0;
  svg.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;dragging=true;dx0=e.clientX;dy0=e.clientY;tx0=tx;ty0=ty;svg.style.cursor='grabbing';});
  window.addEventListener('mousemove',e=>{if(!dragging)return;tx=tx0+(e.clientX-dx0);ty=ty0+(e.clientY-dy0);applyT();});
  window.addEventListener('mouseup',()=>{dragging=false;svg.style.cursor='';});
}

function showTip(e,n){hideTip();const t=document.createElement('div');t.className='tooltip';
  const nd=NODES.find(x=>x.id===n.id);t.innerHTML=`<strong>${n.name}</strong>${nd?'<br>'+nd.desc:'<br>Module Category'}`;
  t.style.left=(e.clientX+10)+'px';t.style.top=(e.clientY-8)+'px';document.body.appendChild(t);t.id='tip';}
function hideTip(){const t=document.getElementById('tip');if(t)t.remove();}
function zIn(){if(zb){zb.s=Math.min(5,zb.s*1.2);zb.applyT();}}
function zOut(){if(zb){zb.s=Math.max(0.2,zb.s/1.2);zb.applyT();}}
function zReset(){if(zb){zb.s=1;zb.tx=0;zb.ty=0;zb.applyT();}}

function selectNode(id) {
  const node = NODES.find(n => n.id === id); if(!node) return;
  document.querySelectorAll('.node-item').forEach(el=>el.classList.remove('active'));
  const item=document.querySelector(`.node-item[data-id="${id}"]`);
  if(item){item.classList.add('active');const cat=item.closest('.category');
    if(cat){cat.querySelector('.children').classList.add('open');cat.querySelector('.arrow').classList.add('open');}
    item.scrollIntoView({behavior:'smooth',block:'center'});}
  document.querySelectorAll('.node').forEach(el=>{
    const nid=el.dataset.id;
    if(nid===id||nid===node.cat||(node.r&&node.r.includes(nid)))el.style.opacity='1';else el.style.opacity='0.15';});
  const cat=C.find(c=>c.id===node.cat);
  const detail=document.getElementById('detail');
  detail.innerHTML=`<div class="detail-header"><h2><span class="cat-dot" style="background:${cat.c};width:11px;height:11px;"></span>${node.name}</h2>
    <span class="tag" style="background:${cat.c}22;color:${cat.c}">${cat.name}</span>
    <p class="desc">${node.desc}</p></div>
    <div class="detail-class"><div class="cls-label">Core Class</div><code>${node.cls}</code></div>
    <div class="detail-section"><h3>Features (${node.f.length})</h3><ul>${node.f.map(f=>
      `<li><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${cat.c};margin-top:7px;flex-shrink:0;"></span>${f}</li>`).join('')}</ul></div>
    <div class="relations"><h3>Related (${(node.r||[]).length})</h3><div style="margin-top:3px;">
      ${(node.r||[]).map(rid=>{const rn=NODES.find(n=>n.id===rid);return rn?`<span class="rel-item" onclick="selectNode('${rid}')">${rn.name}</span>`:'';}).join('')}</div></div>`;
}

function setupSearch() {
  document.getElementById('search').addEventListener('input',e=>{
    const q=e.target.value.toLowerCase().trim();
    if(!q){document.querySelectorAll('.category').forEach(el=>el.style.display='');
      document.querySelectorAll('.node-item').forEach(el=>el.style.display='');
      document.querySelectorAll('.node').forEach(el=>el.style.opacity='');return;}
    document.querySelectorAll('.node-item').forEach(el=>{
      const id=el.dataset.id;const n=NODES.find(x=>x.id===id);
      const m=n&&(n.name.toLowerCase().includes(q)||n.desc.toLowerCase().includes(q)||n.cls.toLowerCase().includes(q)||n.f.some(f=>f.toLowerCase().includes(q)));
      el.style.display=m?'':'none';
      if(m){const cat=el.closest('.category');cat.querySelector('.children').classList.add('open');cat.querySelector('.arrow').classList.add('open');}});
    document.querySelectorAll('.category').forEach(cat=>{
      const has=Array.from(cat.querySelectorAll('.node-item')).some(el=>el.style.display!=='none');cat.style.display=has?'':'none';});
    document.querySelectorAll('.node').forEach(el=>{
      const nid=el.dataset.id;const n=NODES.find(x=>x.id===nid);const cat=C.find(c=>c.id===nid);
      if(cat){const cn=NODES.filter(n=>n.cat===cat.id);el.style.opacity=(cat.name.toLowerCase().includes(q)||cn.some(n=>n.name.toLowerCase().includes(q)||n.desc.toLowerCase().includes(q)))?'1':'0.1';}
      else if(n){el.style.opacity=(n.name.toLowerCase().includes(q)||n.desc.toLowerCase().includes(q)||n.cls.toLowerCase().includes(q))?'1':'0.1';}});
  });
}

function switchView(view) {
  document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(view==='graph'){document.getElementById('graph-area').classList.remove('hidden');document.getElementById('list-view').classList.remove('active');}
  else{document.getElementById('graph-area').classList.add('hidden');document.getElementById('list-view').classList.add('active');renderListView();}
}
function renderListView() {
  let h='';C.forEach(cat=>{
    h+=`<div class="cat-group-title" style="border-color:${cat.c}"><span style="color:${cat.c}">●</span> ${cat.name} <span style="font-size:13px;font-weight:400;color:var(--text2);margin-left:7px;">${cat.desc}</span></div>`;
    cat.children.forEach(n=>{h+=`<div class="list-card" onclick="selectNode('${n.id}')" style="border-left:3px solid ${cat.c}">
      <h3><span style="color:${cat.c}">●</span> ${n.name} <code style="font-size:10px;color:var(--text2);font-weight:400;">${n.cls}</code></h3>
      <p>${n.desc}</p><div style="margin-top:7px;display:flex;flex-wrap:wrap;gap:3px;">
      ${n.f.slice(0,5).map(f=>`<span style="font-size:10px;background:var(--surface);padding:2px 7px;border-radius:10px;color:var(--text2);border:1px solid var(--border);">${f}</span>`).join('')}
      ${n.f.length>5?`<span style="font-size:10px;color:var(--text2);padding:2px 7px;">+${n.f.length-5} more</span>`:''}</div>
      <div style="margin-top:5px;display:flex;flex-wrap:wrap;gap:3px;">${(n.r||[]).slice(0,4).map(rid=>{const rn=NODES.find(x=>x.id===rid);return rn?`<span style="font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(124,172,248,0.1);color:var(--accent);">→ ${rn.name}</span>`:'';}).join('')}</div></div>`;});});
  document.getElementById('list-view').innerHTML=h;
}

init();
</script>
</body>
</html>
